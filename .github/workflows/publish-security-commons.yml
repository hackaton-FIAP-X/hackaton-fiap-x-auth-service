name: Publish security-commons

on:
  push:
    tags:
      - 'security-commons-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/security-commons-v}"
          ./mvnw -f security-commons/pom.xml -B org.codehaus.mojo:versions-maven-plugin:2.17.1:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Publish to GitHub Packages
        run: ./mvnw -f security-commons/pom.xml -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
